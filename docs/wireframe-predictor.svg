<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title-bold { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .wire-box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .wire-box-dark { fill: #0f172a; stroke: #0f172a; stroke-width: 1.5; }
      .wire-fill-dark { fill: #0f172a; }
      .wire-fill-light { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .wire-line { stroke: #475569; stroke-width: 2; stroke-linecap: round; }
      .wire-line-sm { stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; }
      .wire-x { stroke: #475569; stroke-width: 1.4; }
      .text-caption { font-size: 11px; fill: #475569; font-weight: 600; text-anchor: middle; }
      .logo-circle { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .logo-icon { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Page Container Frame -->
  <rect x="40" y="30" width="1120" height="1290" rx="8" class="wire-box" stroke-width="2" />
  
  <!-- Browser Chrome -->
  <rect x="40" y="30" width="1120" height="40" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="65" cy="50" r="5" fill="#cbd5e1" />
  <circle cx="80" cy="50" r="5" fill="#cbd5e1" />
  <circle cx="95" cy="50" r="5" fill="#cbd5e1" />
  <rect x="130" y="40" width="450" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="145" y="54" font-size="11" fill="#64748b">https://wattwise.lk/predict</text>

  <!-- TOP NAVIGATION BAR -->
  <g id="navbar" transform="translate(40, 70)">
    <rect x="0" y="0" width="1120" height="65" class="wire-box" />
    <circle cx="50" cy="32" r="18" class="logo-circle" />
    <text x="50" y="32" class="logo-icon">⚡</text>
    <text x="80" y="38" font-size="18" font-weight="800" fill="#0f172a">WattWise</text>
    
    <!-- Nav Links (Predictor active) -->
    <g transform="translate(420, 20)">
      <rect x="0" y="0" width="70" height="26" rx="4" class="wire-box" />
      <text x="35" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Home</text>

      <rect x="80" y="0" width="75" height="26" rx="4" class="wire-box" />
      <text x="117" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Features</text>

      <rect x="165" y="0" width="80" height="26" rx="4" class="wire-box-dark" />
      <text x="205" y="17" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Predictor</text>

      <rect x="255" y="0" width="80" height="26" rx="4" class="wire-box" />
      <text x="295" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">CEB Slabs</text>

      <rect x="345" y="0" width="75" height="26" rx="4" class="wire-box" />
      <text x="382" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Solar PV</text>

      <rect x="430" y="0" width="75" height="26" rx="4" class="wire-box" />
      <text x="467" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Contact</text>
    </g>

    <rect x="990" y="18" width="90" height="28" rx="6" class="wire-box-dark" />
    <text x="1035" y="36" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">My Account</text>
  </g>

  <!-- PREDICTOR PAGE TITLE &amp; QUICK PRESETS -->
  <g id="predictor-header" transform="translate(40, 135)">
    <rect x="0" y="0" width="1120" height="75" class="wire-fill-light" />
    <text x="40" y="34" font-size="18" font-weight="800" fill="#0f172a">⚡ ML Energy Consumption Predictor</text>
    <text x="40" y="55" font-size="11" fill="#64748b">Trained Random Forest Regressor • 30 Telemetry Input Vectors • CEB 2024 Slab Calculations</text>
    
    <!-- Quick Scenario Preset Pills -->
    <g transform="translate(680, 22)">
      <rect x="0" y="0" width="95" height="30" rx="15" class="wire-box" />
      <text x="47" y="19" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">🌅 Morning</text>

      <rect x="105" y="0" width="95" height="30" rx="15" class="wire-box-dark" />
      <text x="152" y="19" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">☀️ Afternoon</text>

      <rect x="210" y="0" width="95" height="30" rx="15" class="wire-box" />
      <text x="257" y="19" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">🌆 Evening</text>

      <rect x="315" y="0" width="95" height="30" rx="15" class="wire-box" />
      <text x="362" y="19" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">🌙 Night</text>
    </g>
  </g>

  <!-- 2-COLUMN MAIN WORKSPACE: INPUT TELEMETRY FORM (LEFT) vs ML RESULT CARD &amp; TARIFF GAUGE (RIGHT) -->
  <g id="predictor-workspace" transform="translate(40, 210)">
    
    <!-- LEFT COLUMN: SENSOR &amp; APPLIANCE INPUTS -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="520" height="740" rx="8" class="wire-box" />
      
      <rect x="25" y="20" width="180" height="20" rx="4" class="wire-fill-dark" />
      <text x="115" y="34" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ENVIRONMENTAL TELEMETRY</text>

      <!-- Indoor / Outdoor Temp -->
      <g transform="translate(25, 55)">
        <text x="0" y="12" font-size="11" font-weight="600" fill="#334155">Indoor Temperature (°C)</text>
        <rect x="0" y="20" width="220" height="36" rx="4" class="wire-box" />
        <text x="15" y="43" font-size="12" font-weight="700" fill="#0f172a">24.5 °C</text>

        <text x="250" y="12" font-size="11" font-weight="600" fill="#334155">Outdoor Temperature (°C)</text>
        <rect x="250" y="20" width="220" height="36" rx="4" class="wire-box" />
        <text x="265" y="43" font-size="12" font-weight="700" fill="#0f172a">31.2 °C</text>
      </g>

      <!-- Indoor / Outdoor Humidity -->
      <g transform="translate(25, 130)">
        <text x="0" y="12" font-size="11" font-weight="600" fill="#334155">Indoor Relative Humidity (%)</text>
        <rect x="0" y="20" width="220" height="36" rx="4" class="wire-box" />
        <text x="15" y="43" font-size="12" font-weight="700" fill="#0f172a">65 %</text>

        <text x="250" y="12" font-size="11" font-weight="600" fill="#334155">Outdoor Relative Humidity (%)</text>
        <rect x="250" y="20" width="220" height="36" rx="4" class="wire-box" />
        <text x="265" y="43" font-size="12" font-weight="700" fill="#0f172a">78 %</text>
      </g>

      <!-- Occupancy &amp; Hour -->
      <g transform="translate(25, 205)">
        <text x="0" y="12" font-size="11" font-weight="600" fill="#334155">Active Occupants (Count)</text>
        <rect x="0" y="20" width="220" height="36" rx="4" class="wire-box" />
        <text x="15" y="43" font-size="12" font-weight="700" fill="#0f172a">4 Persons</text>

        <text x="250" y="12" font-size="11" font-weight="600" fill="#334155">Hour of Day (0–23)</text>
        <rect x="250" y="20" width="220" height="36" rx="4" class="wire-box" />
        <text x="265" y="43" font-size="12" font-weight="700" fill="#0f172a">14:00 (2 PM)</text>
      </g>

      <!-- APPLIANCE TOGGLE SWITCHES -->
      <g transform="translate(25, 290)">
        <rect x="0" y="0" width="160" height="18" rx="3" class="wire-fill-dark" />
        <text x="80" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ACTIVE APPLIANCES</text>

        <!-- 6 Appliance Check Cards -->
        <g transform="translate(0, 30)">
          <!-- AC -->
          <rect x="0" y="0" width="220" height="42" rx="6" class="wire-box-dark" />
          <text x="15" y="26" font-size="12" font-weight="700" fill="#ffffff">❄️ Inverter AC (Active)</text>
          <circle cx="195" cy="21" r="8" fill="#ffffff" />

          <!-- Fridge -->
          <rect x="250" y="0" width="220" height="42" rx="6" class="wire-box-dark" />
          <text x="265" y="26" font-size="12" font-weight="700" fill="#ffffff">🧊 Refrigerator (Active)</text>
          <circle cx="445" cy="21" r="8" fill="#ffffff" />

          <!-- Lighting -->
          <rect x="0" y="52" width="220" height="42" rx="6" class="wire-box-dark" />
          <text x="15" y="78" font-size="12" font-weight="700" fill="#ffffff">💡 Lighting (Active)</text>
          <circle cx="195" cy="73" r="8" fill="#ffffff" />

          <!-- TV -->
          <rect x="250" y="52" width="220" height="42" rx="6" class="wire-box" />
          <text x="265" y="78" font-size="12" font-weight="600" fill="#64748b">📺 Smart TV (Off)</text>
          <circle cx="445" cy="73" r="8" fill="#cbd5e1" />

          <!-- Washing Machine -->
          <rect x="0" y="104" width="220" height="42" rx="6" class="wire-box" />
          <text x="15" y="130" font-size="12" font-weight="600" fill="#64748b">🧺 Washer (Off)</text>
          <circle cx="195" cy="125" r="8" fill="#cbd5e1" />

          <!-- Water Heater -->
          <rect x="250" y="104" width="220" height="42" rx="6" class="wire-box" />
          <text x="265" y="130" font-size="12" font-weight="600" fill="#64748b">🚿 Water Heater (Off)</text>
          <circle cx="445" cy="125" r="8" fill="#cbd5e1" />
        </g>
      </g>

      <!-- EXECUTE BUTTON -->
      <g transform="translate(25, 480)">
        <rect x="0" y="0" width="470" height="50" rx="8" class="wire-box-dark" />
        <text x="235" y="30" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">⚡ RUN RANDOM FOREST PREDICTION</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: ML PREDICTION RESULTS &amp; CEB SLAB BREAKDOWN -->
    <g transform="translate(570, 20)">
      <rect x="0" y="0" width="520" height="740" rx="8" class="wire-box" />
      
      <!-- Prediction Main Badge -->
      <g transform="translate(25, 20)">
        <rect x="0" y="0" width="470" height="150" rx="8" class="wire-fill-light" />
        <text x="20" y="32" font-size="11" font-weight="700" fill="#64748b">PREDICTED ENERGY CONSUMPTION</text>
        <text x="20" y="76" font-size="36" font-weight="900" fill="#0f172a">258.93 <tspan font-size="20" font-weight="700" fill="#475569">Wh</tspan></text>
        <text x="20" y="102" font-size="13" font-weight="600" fill="#0f172a">≈ 0.259 kWh / hour &amp;nbsp;|&amp;nbsp; Estimated Monthly: 186.4 Units</text>
        
        <rect x="330" y="20" width="120" height="30" rx="15" class="wire-box-dark" />
        <text x="390" y="39" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">HIGH LOAD TIER</text>
      </g>

      <!-- CEB 2024 Slab Cost Breakdown -->
      <g transform="translate(25, 190)">
        <rect x="0" y="0" width="200" height="18" rx="3" class="wire-fill-dark" />
        <text x="100" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CEB 2024 TARIFF SLAB ACCUMULATION</text>

        <!-- Slab Matrix -->
        <g transform="translate(0, 30)">
          <rect x="0" y="0" width="470" height="30" class="wire-fill-light" />
          <text x="15" y="20" font-size="11" font-weight="700" fill="#0f172a">Slab Tier (Units)</text>
          <text x="180" y="20" font-size="11" font-weight="700" fill="#0f172a">Units</text>
          <text x="280" y="20" font-size="11" font-weight="700" fill="#0f172a">Rate (LKR)</text>
          <text x="390" y="20" font-size="11" font-weight="700" fill="#0f172a">Amount (LKR)</text>

          <rect x="0" y="32" width="470" height="24" class="wire-box" />
          <text x="15" y="48" font-size="11" fill="#334155">0 – 30 Units</text>
          <text x="180" y="48" font-size="11" fill="#334155">30</text>
          <text x="280" y="48" font-size="11" fill="#334155">Rs. 2.50</text>
          <text x="390" y="48" font-size="11" font-weight="700" fill="#0f172a">Rs. 75.00</text>

          <rect x="0" y="58" width="470" height="24" class="wire-box" />
          <text x="15" y="74" font-size="11" fill="#334155">31 – 60 Units</text>
          <text x="180" y="74" font-size="11" fill="#334155">30</text>
          <text x="280" y="74" font-size="11" fill="#334155">Rs. 4.85</text>
          <text x="390" y="74" font-size="11" font-weight="700" fill="#0f172a">Rs. 145.50</text>

          <rect x="0" y="84" width="470" height="24" class="wire-box" />
          <text x="15" y="100" font-size="11" fill="#334155">61 – 90 Units</text>
          <text x="180" y="100" font-size="11" fill="#334155">30</text>
          <text x="280" y="100" font-size="11" fill="#334155">Rs. 7.85</text>
          <text x="390" y="100" font-size="11" font-weight="700" fill="#0f172a">Rs. 235.50</text>

          <rect x="0" y="110" width="470" height="24" class="wire-box" />
          <text x="15" y="126" font-size="11" fill="#334155">91 – 120 Units</text>
          <text x="180" y="126" font-size="11" fill="#334155">30</text>
          <text x="280" y="126" font-size="11" fill="#334155">Rs. 10.00</text>
          <text x="390" y="126" font-size="11" font-weight="700" fill="#0f172a">Rs. 300.00</text>

          <rect x="0" y="136" width="470" height="24" class="wire-box" />
          <text x="15" y="152" font-size="11" fill="#334155">121 – 180 Units</text>
          <text x="180" y="152" font-size="11" fill="#334155">60</text>
          <text x="280" y="152" font-size="11" fill="#334155">Rs. 27.75</text>
          <text x="390" y="152" font-size="11" font-weight="700" fill="#0f172a">Rs. 1,665.00</text>

          <!-- Fixed Charge &amp; Total -->
          <rect x="0" y="165" width="470" height="50" rx="4" class="wire-fill-dark" />
          <text x="15" y="186" font-size="11" fill="#cbd5e1">Fixed Monthly Charge: Rs. 2,000.00</text>
          <text x="15" y="204" font-size="14" font-weight="800" fill="#ffffff">TOTAL ESTIMATED BILL: Rs. 4,709.00 LKR</text>
        </g>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(25, 480)">
        <rect x="0" y="0" width="220" height="40" rx="6" class="wire-box" />
        <text x="110" y="25" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📄 Export PDF Report</text>

        <rect x="250" y="0" width="220" height="40" rx="6" class="wire-box-dark" />
        <text x="360" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">💾 Save to History Log</text>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <g id="footer" transform="translate(40, 1020)">
    <rect x="0" y="0" width="1120" height="230" class="wire-box" />
    <text x="50" y="40" font-size="14" font-weight="800" fill="#0f172a">⚡ WattWise Prediction Engine</text>
    <text x="50" y="65" font-size="11" fill="#64748b">Calculations are strictly calibrated to the Ceylon Electricity Board (CEB) 2024 Residential Tariff Structure.</text>
    <line x1="0" y1="160" x2="1120" y2="160" class="wire-box" />
    <text x="50" y="195" font-size="11" fill="#64748b">© 2026 WattWise Energy System. All rights reserved.</text>
  </g>

</svg>
