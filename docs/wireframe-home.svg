    <text x="40" y="130" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">&lt;</text>

    <circle cx="1080" cy="130" r="20" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <text x="1080" y="130" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">&gt;</text>

    <!-- Slide Caption Card -->
    <rect x="360" y="80" width="400" height="90" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <text x="560" y="112" class="title-bold" text-anchor="middle">Intelligent Energy Forecasting</text>
    <text x="560" y="136" font-size="13" fill="#475569" text-anchor="middle">CEB 2024 Tariff Slabs • Random Forest ML Prediction</text>
    <rect x="490" y="146" width="140" height="26" rx="4" class="wire-box-dark" />
    <text x="560" y="163" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Start Prediction ➔</text>

