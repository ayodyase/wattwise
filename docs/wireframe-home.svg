      <line x1="0" y1="48" x2="520" y2="48" class="wire-line-thick" />
      <line x1="0" y1="66" x2="500" y2="66" class="wire-line" />
      <line x1="0" y1="84" x2="520" y2="84" class="wire-line" />
      <line x1="0" y1="102" x2="460" y2="102" class="wire-line" />
      <line x1="0" y1="120" x2="510" y2="120" class="wire-line" />
      <line x1="0" y1="138" x2="380" y2="138" class="wire-line" />

