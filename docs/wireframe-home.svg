        <rect x="115" y="0" width="115" height="30" rx="4" class="wire-fill-light" />
        <text x="172" y="19" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">19,735 Telemetry</text>

        <rect x="245" y="0" width="135" height="30" rx="4" class="wire-box-dark" />
        <text x="312" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Features ➔</text>
      </g>
    </g>
  </g>

