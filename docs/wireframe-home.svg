      <circle cx="30" cy="20" r="18" class="logo-circle" />
      <text x="30" y="20" class="logo-icon">⚡</text>
      <text x="60" y="26" font-size="18" font-weight="800" fill="#0f172a">WattWise LK</text>

      <text x="0" y="65" font-size="12" fill="#475569" width="280">AI-driven smart electricity consumption forecasting and Ceylon Electricity Board bill optimization platform.</text>

      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="24" height="24" rx="4" class="wire-box" />
        <text x="12" y="16" font-size="12" text-anchor="middle">📍</text>
        <text x="35" y="16" font-size="12" font-weight="600" fill="#1e293b">123 Energy Plaza, Colombo 03, LK</text>

        <rect x="0" y="36" width="24" height="24" rx="4" class="wire-box" />
        <text x="12" y="52" font-size="12" text-anchor="middle">📞</text>
        <text x="35" y="52" font-size="12" font-weight="600" fill="#1e293b">+94 11 234 5678 / +94 77 123 4567</text>

        <rect x="0" y="72" width="24" height="24" rx="4" class="wire-box" />
        <text x="12" y="88" font-size="12" text-anchor="middle">📧</text>
        <text x="35" y="88" font-size="12" font-weight="600" fill="#1e293b">support@wattwise.lk</text>
