    <rect x="0" y="0" width="1120" height="260" class="wire-box" />
    <line x1="0" y1="0" x2="1120" y2="260" class="wire-x" />
    <line x1="1120" y1="0" x2="0" y2="260" class="wire-x" />
    
    <!-- Left / Right Carousel Buttons -->
