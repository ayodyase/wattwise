        <text x="18" y="9" font-size="12" font-weight="600" fill="#1e293b">ML Energy Predictor Engine</text>

        <circle cx="5" cy="30" r="3" fill="#0f172a" />
        <text x="18" y="34" font-size="12" font-weight="600" fill="#1e293b">CEB 2024 Tiered Tariff Slabs</text>

        <circle cx="5" cy="55" r="3" fill="#0f172a" />
        <text x="18" y="59" font-size="12" font-weight="600" fill="#1e293b">Rooftop Solar PV Simulator</text>

        <circle cx="5" cy="80" r="3" fill="#0f172a" />
