      <line x1="130" y1="0" x2="245" y2="65" class="wire-x" />
      <line x1="245" y1="0" x2="130" y2="65" class="wire-x" />
      <rect x="155" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="187" y="37" class="text-caption">LECO</text>

      <!-- Sponsor 3: SLSEA -->
      <rect x="260" y="0" width="115" height="65" rx="6" class="wire-box" />
      <line x1="260" y1="0" x2="375" y2="65" class="wire-x" />
      <line x1="375" y1="0" x2="260" y2="65" class="wire-x" />
      <rect x="285" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="317" y="37" class="text-caption">SLSEA</text>

      <!-- Sponsor 4: ICBT -->
      <rect x="390" y="0" width="115" height="65" rx="6" class="wire-box" />
      <line x1="390" y1="0" x2="505" y2="65" class="wire-x" />
      <line x1="505" y1="0" x2="390" y2="65" class="wire-x" />
      <rect x="415" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="447" y="37" class="text-caption">ICBT</text>

      <!-- Sponsor 5: Kaggle -->
      <rect x="520" y="0" width="115" height="65" rx="6" class="wire-box" />
      <line x1="520" y1="0" x2="635" y2="65" class="wire-x" />
      <line x1="635" y1="0" x2="520" y2="65" class="wire-x" />
      <rect x="545" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="577" y="37" class="text-caption">Kaggle</text>

      <!-- Sponsor 6: React -->
      <rect x="650" y="0" width="115" height="65" rx="6" class="wire-box" />
      <line x1="650" y1="0" x2="765" y2="65" class="wire-x" />
      <line x1="765" y1="0" x2="650" y2="65" class="wire-x" />
      <rect x="675" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="707" y="37" class="text-caption">React 18</text>

      <!-- Sponsor 7: Python Flask -->
      <rect x="780" y="0" width="115" height="65" rx="6" class="wire-box" />
      <line x1="780" y1="0" x2="895" y2="65" class="wire-x" />
      <line x1="895" y1="0" x2="780" y2="65" class="wire-x" />
      <rect x="805" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="837" y="37" class="text-caption">Python ML</text>

      <!-- Sponsor 8: MongoDB -->
      <rect x="910" y="0" width="115" height="65" rx="6" class="wire-box" />
      <line x1="910" y1="0" x2="1025" y2="65" class="wire-x" />
      <line x1="1025" y1="0" x2="910" y2="65" class="wire-x" />
      <rect x="935" y="22" width="65" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" />
      <text x="967" y="37" class="text-caption">MongoDB</text>
    </g>
  </g>

  <!-- 4. FOOTER (3 COLUMNS: CONTACT FORM, SITEMAP, BUSINESS INFO) -->
