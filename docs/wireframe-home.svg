        <text x="18" y="134" font-size="12" font-weight="600" fill="#1e293b">Building Multi-Unit Manager</text>

        <circle cx="5" cy="155" r="3" fill="#0f172a" />
        <text x="18" y="159" font-size="12" font-weight="600" fill="#1e293b">Enterprise Admin Console</text>
