<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title-bold { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .section-heading { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .wire-box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .wire-box-dark { fill: #0f172a; stroke: #0f172a; stroke-width: 1.5; }
      .wire-fill-dark { fill: #0f172a; }
      .wire-fill-light { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .wire-line { stroke: #475569; stroke-width: 2; stroke-linecap: round; }
      .wire-line-sm { stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; }
      .wire-x { stroke: #475569; stroke-width: 1.4; }
      .text-caption { font-size: 11px; fill: #475569; font-weight: 600; text-anchor: middle; }
      .logo-circle { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .logo-icon { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Page Container Frame -->
  <rect x="40" y="30" width="1120" height="1040" rx="8" class="wire-box" stroke-width="2" />
  
  <!-- Browser Chrome -->
  <rect x="40" y="30" width="1120" height="40" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="65" cy="50" r="5" fill="#cbd5e1" />
  <circle cx="80" cy="50" r="5" fill="#cbd5e1" />
  <circle cx="95" cy="50" r="5" fill="#cbd5e1" />
  <rect x="130" y="40" width="450" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="145" y="54" font-size="11" fill="#64748b">https://wattwise.lk/contact</text>

  <!-- TOP NAVIGATION BAR -->
  <g id="navbar" transform="translate(40, 70)">
    <rect x="0" y="0" width="1120" height="65" class="wire-box" />
    <circle cx="50" cy="32" r="18" class="logo-circle" />
    <text x="50" y="32" class="logo-icon">⚡</text>
    <text x="80" y="38" font-size="18" font-weight="800" fill="#0f172a">WattWise</text>
    
    <!-- Nav Links (Contact active) -->
    <g transform="translate(420, 20)">
      <rect x="0" y="0" width="70" height="26" rx="4" class="wire-box" />
      <text x="35" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Home</text>

      <rect x="80" y="0" width="75" height="26" rx="4" class="wire-box" />
      <text x="117" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Features</text>

      <rect x="165" y="0" width="80" height="26" rx="4" class="wire-box" />
      <text x="205" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Predictor</text>

      <rect x="255" y="0" width="80" height="26" rx="4" class="wire-box" />
      <text x="295" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">CEB Slabs</text>

      <rect x="345" y="0" width="75" height="26" rx="4" class="wire-box" />
      <text x="382" y="17" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Solar PV</text>

      <rect x="430" y="0" width="75" height="26" rx="4" class="wire-box-dark" />
      <text x="467" y="17" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Contact</text>
    </g>

    <rect x="990" y="18" width="90" height="28" rx="6" class="wire-box-dark" />
    <text x="1035" y="36" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Sign In</text>
  </g>

  <!-- QUICK CONTACT PILLS BAR -->
  <g id="quick-contact" transform="translate(40, 135)">
    <rect x="0" y="0" width="1120" height="70" class="wire-fill-light" />
    
    <g transform="translate(50, 16)">
      <!-- Phone Pill -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="38" rx="6" class="wire-box" />
        <rect x="10" y="9" width="20" height="20" rx="3" class="wire-box" />
        <line x1="10" y1="9" x2="30" y2="29" class="wire-x" />
        <line x1="30" y1="9" x2="10" y2="29" class="wire-x" />
        <text x="40" y="24" font-size="12" font-weight="700" fill="#0f172a">📞 +94 11 234 5678</text>
      </g>

      <!-- Email Pill -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="240" height="38" rx="6" class="wire-box" />
        <rect x="10" y="9" width="20" height="20" rx="3" class="wire-box" />
        <line x1="10" y1="9" x2="30" y2="29" class="wire-x" />
        <line x1="30" y1="9" x2="10" y2="29" class="wire-x" />
        <text x="40" y="24" font-size="12" font-weight="700" fill="#0f172a">📧 support@wattwise.lk</text>
      </g>

      <!-- Working Hours Pill -->
      <g transform="translate(500, 0)">
        <rect x="0" y="0" width="280" height="38" rx="6" class="wire-box" />
        <rect x="10" y="9" width="20" height="20" rx="3" class="wire-box" />
        <line x1="10" y1="9" x2="30" y2="29" class="wire-x" />
        <line x1="30" y1="9" x2="10" y2="29" class="wire-x" />
        <text x="40" y="24" font-size="12" font-weight="700" fill="#0f172a">⏰ Mon – Fri: 8:30 AM – 5:00 PM</text>
      </g>
    </g>
  </g>

  <!-- MAIN CONTACT &amp; GOOGLE MAP BODY (2 COLUMNS) -->
  <g id="contact-body" transform="translate(40, 205)">
    <rect x="0" y="0" width="1120" height="490" class="wire-box" />

    <!-- Left Column: Contact Form -->
    <g transform="translate(50, 30)">
      <rect x="0" y="0" width="220" height="24" rx="4" class="wire-fill-dark" />
      <text x="10" y="17" font-size="13" font-weight="800" fill="#ffffff">Send Us a Direct Message</text>

      <text x="0" y="55" font-size="11" font-weight="600" fill="#334155">Your Full Name *</text>
      <rect x="0" y="63" width="460" height="36" rx="4" class="wire-box" />

      <text x="0" y="123" font-size="11" font-weight="600" fill="#334155">Email Address *</text>
      <rect x="0" y="131" width="460" height="36" rx="4" class="wire-box" />

      <text x="0" y="191" font-size="11" font-weight="600" fill="#334155">Subject / Department *</text>
      <rect x="0" y="199" width="460" height="36" rx="4" class="wire-box" />

      <text x="0" y="259" font-size="11" font-weight="600" fill="#334155">Message Details *</text>
      <rect x="0" y="267" width="460" height="95" rx="4" class="wire-box" />

      <rect x="0" y="380" width="160" height="38" rx="6" class="wire-box-dark" />
      <text x="80" y="404" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✉️ Submit Inquiry</text>
    </g>

    <!-- Right Column: Interactive Google Map Embed Container -->
    <g transform="translate(570, 30)">
      <rect x="0" y="0" width="500" height="430" rx="8" class="wire-box" />
      <line x1="0" y1="0" x2="500" y2="430" class="wire-x" />
      <line x1="500" y1="0" x2="0" y2="430" class="wire-x" />
      
      <!-- Inset Map Header Badge / Location Card -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="280" height="90" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
        <rect x="15" y="15" width="24" height="24" rx="4" class="wire-box-dark" />
        <text x="27" y="31" font-size="12" text-anchor="middle" fill="#ffffff">📍</text>
        <text x="50" y="28" font-size="12" font-weight="800" fill="#0f172a">WattWise Energy HQ</text>
        <text x="50" y="44" font-size="10" fill="#64748b">123 Energy Plaza, Colombo 03</text>
        <text x="50" y="58" font-size="10" fill="#64748b">Sri Lanka Sustainable Energy Hub</text>
        <rect x="50" y="66" width="100" height="16" rx="3" class="wire-fill-dark" />
        <text x="100" y="78" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Open in Maps ↗</text>
      </g>

      <rect x="150" y="380" width="200" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <text x="250" y="399" class="text-caption">🗺️ Embedded Google Map Container</text>
    </g>
  </g>

  <!-- CONTACT FOOTER -->
  <g id="footer" transform="translate(40, 695)">
    <rect x="0" y="0" width="1120" height="280" class="wire-box" />
    
    <!-- Col 1: Details -->
    <g transform="translate(50, 30)">
      <rect x="0" y="0" width="140" height="18" rx="3" class="wire-fill-dark" />
      <text x="70" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">OFFICE LOCATION</text>
      <text x="0" y="45" font-size="11" fill="#334155">123 Energy Plaza, Colombo 03, Sri Lanka</text>
      <text x="0" y="65" font-size="11" fill="#334155">Direct Helpline: +94 11 234 5678</text>
      <text x="0" y="85" font-size="11" fill="#334155">Email Support: support@wattwise.lk</text>
    </g>

    <!-- Col 2: Sitemap -->
    <g transform="translate(420, 30)">
      <rect x="0" y="0" width="120" height="18" rx="3" class="wire-fill-dark" />
      <text x="60" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">QUICK LINKS</text>
      <text x="0" y="45" font-size="11" fill="#334155">• ML Predictor Engine &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; • CEB 2024 Slabs</text>
      <text x="0" y="65" font-size="11" fill="#334155">• Rooftop Solar PV &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; • Saving Tips Library</text>
      <text x="0" y="85" font-size="11" fill="#334155">• Admin Console &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; • Privacy Policy</text>
    </g>

    <!-- Col 3: Brand -->
    <g transform="translate(820, 30)">
      <circle cx="25" cy="18" r="16" class="logo-circle" />
      <text x="25" y="18" class="logo-icon">⚡</text>
      <text x="50" y="24" font-size="16" font-weight="800" fill="#0f172a">WattWise LK</text>
      <text x="0" y="60" font-size="11" fill="#64748b">Sustainable Energy Forecasting &amp; Tariff Management.</text>
    </g>

    <line x1="0" y1="210" x2="1120" y2="210" class="wire-box" />
    <text x="50" y="245" font-size="11" fill="#64748b">© 2026 WattWise Energy Management System. All rights reserved.</text>
  </g>

</svg>
